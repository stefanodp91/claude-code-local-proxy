name: CI

# Everything here runs without a GPU, without LM Studio, and without a model
# loaded. That is the whole point: proxy/scripts/regression.sh needs a live
# backend and so could never watch a change, which is why the proxy shipped for
# months with nothing watching it.
#
# It runs when asked, and only then — never once per commit:
#
#   gh workflow run ci.yml --ref <branch>
#
# A commit-message marker was tried first and removed within the hour: the
# commit that introduced `[ci]` described it, therefore contained it, therefore
# triggered the run it was meant to withhold. Any token common enough to type is
# common enough to write about.
#
# The trade is real and deliberate: nothing automatic now stands between a
# broken commit and main. `cd proxy && npm test && npm run typecheck` is the
# gate, and it lives on the machine the commit is made on.

on:
  workflow_dispatch:

jobs:
  proxy:
    name: proxy — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `pretest` fails the run if the glob matches nothing — node --test exits
      # 0 on an empty run, which would otherwise show up as a green build that
      # verified nothing.
      - name: Tests
        run: npm test

  extension:
    name: claudio — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-extension/package-lock.json

      - run: npm ci

      # Extension-host code. `typecheck` resolves `vscode` to @types/vscode;
      # `typecheck:test` resolves it to the test stub instead, so both the real
      # API and the tests are checked.
      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      # The webview suite needs the Angular dependency tree, which lives in its
      # own package.
      - name: Install webview dependencies
        run: cd src/webview-ui && npm ci

      - name: Tests
        run: npm test
